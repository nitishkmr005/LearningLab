        - text: Visit all neighbors at the current level before going deeper. Uses a
        - strong [ref=e2136]: queue (FIFO)
        - text: .
      - paragraph [ref=e2137]:
        - strong [ref=e2138]: "DFS (Depth-First Search):"
        - text: Go as deep as possible down one path before backtracking. Uses a
        - strong [ref=e2139]: stack / recursion (LIFO)
        - text: .
