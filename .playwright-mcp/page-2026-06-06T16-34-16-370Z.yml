      - 'heading "Q19: What is the two-pointer technique?" [level=2] [ref=e2108]'
      - paragraph [ref=e2109]:
        - strong [ref=e2110]: "Intuition:"
        - text: Two pointers move through an array — usually from opposite ends or at different speeds — to avoid nested loops. Turns O(n²) into O(n).
      - paragraph [ref=e2111]:
        - strong [ref=e2112]: "Classic — find a pair summing to target in a SORTED array:"
      - code [ref=e2114]: "def has_pair_sum(arr, target): lo, hi = 0, len(arr) - 1 while lo < hi: s = arr[lo] + arr[hi] if s == target: return True elif s < target: lo += 1 # sum too small → move left pointer right (increase sum) else: hi -= 1 # sum too large → move right pointer left (decrease sum) return False # [1, 3, 5, 7, 9], target=10 → 3+7=10 → True"
      - paragraph [ref=e2115]: "Brute force: check all pairs → O(n²). Two pointers: one pass → O(n)."
      - paragraph [ref=e2116]:
        - strong [ref=e2117]: "Removing duplicates from a sorted array in-place:"
      - code [ref=e2119]: "def remove_duplicates(nums): if not nums: return 0 slow = 0 for fast in range(1, len(nums)): if nums[fast] != nums[slow]: slow += 1 nums[slow] = nums[fast] return slow + 1 # length of unique portion"
      - paragraph [ref=e2120]:
        - strong [ref=e2121]: "Fast/slow pointer — detect a cycle in a linked list:"
      - code [ref=e2123]: "def has_cycle(head): slow = fast = head while fast and fast.next: slow = slow.next # advances 1 step fast = fast.next.next # advances 2 steps if slow is fast: return True # they meet → cycle exists return False"
      - paragraph [ref=e2124]:
        - strong [ref=e2125]: "When to use two pointers:"
      - list [ref=e2126]:
