      - 'heading "Q16: What is a hash map and why is it O(1) lookup?" [level=2] [ref=e2034]'
      - paragraph [ref=e2035]:
        - strong [ref=e2036]: "Intuition:"
        - text: A hash map (Python
        - code [ref=e2037]: dict
        - text: ) is like a filing cabinet with labeled drawers. Instead of searching every drawer, you compute which drawer a key belongs to using a hash function — one computation, one lookup.
      - paragraph [ref=e2038]:
        - strong [ref=e2039]: "How it works:"
      - list [ref=e2040]:
        - listitem [ref=e2041]:
          - text: Compute
          - code [ref=e2042]: bucket = hash(key) % num_buckets
          - text: — maps any key to an integer bucket index
        - listitem [ref=e2043]:
          - text: Store the
          - code [ref=e2044]: (key, value)
          - text: pair in that bucket
        - listitem [ref=e2045]: "On lookup: compute the same hash → go directly to that bucket → return value"
      - code [ref=e2047]: "# Python dict is a hash map freq = {} for word in words: freq[word] = freq.get(word, 0) + 1 # O(1) per word # collections.Counter does the same from collections import Counter Counter(['a', 'b', 'a', 'c', 'b', 'a']) # Counter({'a': 3, 'b': 2, 'c': 1})"
      - paragraph [ref=e2048]:
        - strong [ref=e2049]: "Classic interview problem — Two Sum (shows the hash map pattern):"
      - code [ref=e2051]: "def two_sum(nums, target): seen = {} # value → index for i, n in enumerate(nums): complement = target - n if complement in seen: # O(1) lookup return [seen[complement], i] seen[n] = i # O(n) total — vs O(n²) with nested loops"
      - paragraph [ref=e2052]:
        - strong [ref=e2053]: "Other common patterns:"
      - code [ref=e2055]:
        - text: "# Grouping (like a manual groupby) from collections import defaultdict groups = defaultdict(list) for item in data: groups[item['category']].append(item) # LRU cache / memoization from functools import lru_cache"
        - generic [ref=e2056]:
          - text: "@lru_cache("
          - generic [ref=e2057]: maxsize=128
          - text: )
        - text: "def expensive(n): ..."
      - paragraph [ref=e2058]:
        - strong [ref=e2059]: "Hash collision:"
        - text: Two different keys can hash to the same bucket. Python handles this with open addressing (probing nearby buckets). Average case remains O(1); worst case is O(n) but practically rare.
      - separator [ref=e2060]
      - 'heading "Q17: What is binary search and when do you use it?" [level=2] [ref=e2061]'
      - paragraph [ref=e2062]:
        - strong [ref=e2063]: "Intuition:"
        - text: Searching a sorted phone book — you don't start from page 1. You open the middle, decide which half to search, and cut the space in half each step. Binary search does exactly this, requiring
        - strong [ref=e2064]: O(log n)
        - text: comparisons instead of O(n).
      - paragraph [ref=e2065]:
        - strong [ref=e2066]: "Requirement:"
        - text: The array must be sorted. Binary search on an unsorted array is incorrect.
      - paragraph [ref=e2067]:
        - strong [ref=e2068]: "Algorithm:"
      - code [ref=e2070]: "def binary_search(arr, target): lo, hi = 0, len(arr) - 1 while lo <= hi: mid = (lo + hi) // 2 if arr[mid] == target: return mid # found at index mid elif arr[mid] < target: lo = mid + 1 # target is in the right half else: hi = mid - 1 # target is in the left half return -1 # not found # Example: arr = [1, 3, 5, 7, 9], target = 7 # Iteration 1: mid=2, arr[2]=5 < 7 → lo=3 # Iteration 2: mid=3, arr[3]=7 == 7 → return 3"
      - paragraph [ref=e2071]:
        - strong [ref=e2072]:
          - text: Python's
          - code [ref=e2073]: bisect
          - text: "module (use this in production):"
      - code [ref=e2075]: "import bisect arr = [10, 20, 30, 40, 50] bisect.bisect_left(arr, 30) # 2 — leftmost position where 30 can be inserted bisect.bisect_right(arr, 30) # 3 — rightmost position bisect.insort(arr, 25) # insert 25 in sorted position: [10, 20, 25, 30, 40, 50]"
      - paragraph [ref=e2076]:
        - strong [ref=e2077]: "Complexity:"
        - text: O(log n). For n = 1,000,000 → at most 20 iterations.
      - paragraph [ref=e2078]:
        - strong [ref=e2079]: "When to use binary search in DS/ML work:"
      - list [ref=e2080]:
        - listitem [ref=e2081]: Finding the optimal threshold for a classifier (e.g., "find the threshold where precision = 0.9")
        - listitem [ref=e2082]: Searching a sorted list of feature values for a decision tree split point
        - listitem [ref=e2083]:
          - code [ref=e2084]: bisect.insort
          - text: to maintain a sorted running list during streaming feature computation
      - separator [ref=e2085]
      - 'heading "Q18: What is the sliding window technique?" [level=2] [ref=e2086]'
      - paragraph [ref=e2087]:
        - strong [ref=e2088]: "Intuition:"
        - text: When analyzing a contiguous subarray, instead of recomputing from scratch each step, slide the window by adding one element on the right and removing one on the left. Update the running result incrementally → O(n) instead of O(n×k).
      - paragraph [ref=e2089]:
        - strong [ref=e2090]: "Fixed-size window — max sum of K consecutive elements:"
      - code [ref=e2092]: "def max_sum_window(arr, k): window_sum = sum(arr[:k]) # compute the first window max_sum = window_sum for i in range(k, len(arr)): window_sum += arr[i] - arr[i - k] # slide: add new element, drop old max_sum = max(max_sum, window_sum) return max_sum # arr = [2, 1, 5, 1, 3, 2], k = 3 # windows: [2,1,5]=8, [1,5,1]=7, [5,1,3]=9, [1,3,2]=6 → max = 9"
      - paragraph [ref=e2093]: "Brute force would recompute each window sum: O(n × k). Sliding window: O(n)."
      - paragraph [ref=e2094]:
        - strong [ref=e2095]: "Variable-size window — longest substring without repeating characters:"
      - code [ref=e2097]: "def longest_unique_substring(s): seen = {} # char → last seen index lo = 0 # left edge of window max_len = 0 for hi, char in enumerate(s): if char in seen and seen[char] >= lo: lo = seen[char] + 1 # shrink window: push left edge past the duplicate seen[char] = hi max_len = max(max_len, hi - lo + 1) return max_len # \"abcabcbb\" → 3 (\"abc\")"
      - paragraph [ref=e2098]:
        - strong [ref=e2099]: "When to use sliding window:"
      - list [ref=e2100]:
        - listitem [ref=e2101]: "\"Max/min/sum of any subarray of exactly size K\""
        - listitem [ref=e2102]: "\"Longest/shortest subarray satisfying condition X\""
        - listitem [ref=e2103]: Any problem involving a contiguous window over a sequence
      - paragraph [ref=e2104]:
        - strong [ref=e2105]: "DS/ML connection:"
        - text: Rolling window features in time series (7-day moving average, rolling standard deviation) are the data engineering version of this technique.
