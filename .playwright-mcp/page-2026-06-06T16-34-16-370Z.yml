      - 'heading "Q21: What is dynamic programming? When do you use it?" [level=2] [ref=e2181]'
      - paragraph [ref=e2182]:
        - strong [ref=e2183]: "Intuition:"
        - text: Dynamic programming (DP) solves a problem by breaking it into overlapping subproblems and caching each result so it's computed only once. It trades extra memory for dramatically better time complexity.
      - paragraph [ref=e2184]:
        - strong [ref=e2185]: "Two signals that DP might be the right approach:"
      - list [ref=e2186]:
        - listitem [ref=e2187]: The problem can be broken into subproblems of the same type (optimal substructure)
        - listitem [ref=e2188]: The same subproblems appear multiple times (overlapping subproblems)
      - paragraph [ref=e2189]:
        - strong [ref=e2190]: "Example — Fibonacci without DP (exponential time O(2ⁿ)):"
      - code [ref=e2192]: "def fib(n): if n <= 1: return n return fib(n-1) + fib(n-2) # fib(40) recomputes fib(20) over a million times — extremely slow"
      - paragraph [ref=e2193]:
        - strong [ref=e2194]: "Top-down DP (memoization) — cache results as you recurse:"
      - code [ref=e2196]:
        - text: from functools import lru_cache
        - generic [ref=e2197]:
          - text: "@lru_cache("
          - generic [ref=e2198]: maxsize=None
          - text: )
        - text: "def fib(n): if n <= 1: return n return fib(n-1) + fib(n-2) # each value computed exactly once → O(n)"
      - paragraph [ref=e2199]:
        - strong [ref=e2200]: "Bottom-up DP (tabulation) — build up from base cases:"
      - code [ref=e2202]: "def fib(n): dp = [0] * (n + 1) dp[1] = 1 for i in range(2, n + 1): dp[i] = dp[i-1] + dp[i-2] return dp[n] # O(n) time, O(n) space"
      - paragraph [ref=e2203]:
        - strong [ref=e2204]: "Space-optimized (only keep last two values):"
      - code [ref=e2206]: "def fib(n): a, b = 0, 1 for _ in range(n): a, b = b, a + b return a # O(n) time, O(1) space"
