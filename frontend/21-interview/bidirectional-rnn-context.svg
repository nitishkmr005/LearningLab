<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <rect width="1100" height="430" fill="#f6f1e7"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="30" fill="#1c1814" font-weight="700">Bidirectional RNN: left context + right context</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="18" fill="#6e6259">Two RNNs read the same sentence in opposite directions so each token can use both past and future context.</text>

  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#c85e35"/>
    </marker>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1c1814"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <text x="130" y="170" font-size="22" fill="#1c1814">I</text>
    <text x="290" y="170" font-size="22" fill="#1c1814">didn't</text>
    <text x="480" y="170" font-size="22" fill="#1c1814" font-weight="700">like</text>
    <text x="670" y="170" font-size="22" fill="#1c1814">it</text>

    <rect x="95" y="200" width="90" height="54" rx="14" fill="#ede6d6" stroke="#c85e35" stroke-width="3"/>
    <rect x="255" y="200" width="110" height="54" rx="14" fill="#ede6d6" stroke="#c85e35" stroke-width="3"/>
    <rect x="445" y="200" width="90" height="54" rx="14" fill="#ede6d6" stroke="#c85e35" stroke-width="3"/>
    <rect x="635" y="200" width="90" height="54" rx="14" fill="#ede6d6" stroke="#c85e35" stroke-width="3"/>

    <text x="140" y="234" text-anchor="middle" font-size="20" fill="#1c1814">→ h₁</text>
    <text x="310" y="234" text-anchor="middle" font-size="20" fill="#1c1814">→ h₂</text>
    <text x="490" y="234" text-anchor="middle" font-size="20" fill="#1c1814">→ h₃</text>
    <text x="680" y="234" text-anchor="middle" font-size="20" fill="#1c1814">→ h₄</text>

    <line x1="185" y1="227" x2="255" y2="227" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow2)"/>
    <line x1="365" y1="227" x2="445" y2="227" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow2)"/>
    <line x1="535" y1="227" x2="635" y2="227" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow2)"/>

    <rect x="95" y="300" width="90" height="54" rx="14" fill="#1c1814" stroke="#ef8b57" stroke-width="3"/>
    <rect x="255" y="300" width="110" height="54" rx="14" fill="#1c1814" stroke="#ef8b57" stroke-width="3"/>
    <rect x="445" y="300" width="90" height="54" rx="14" fill="#1c1814" stroke="#ef8b57" stroke-width="3"/>
    <rect x="635" y="300" width="90" height="54" rx="14" fill="#1c1814" stroke="#ef8b57" stroke-width="3"/>

    <text x="140" y="334" text-anchor="middle" font-size="20" fill="#f6f1e7">← h₁</text>
    <text x="310" y="334" text-anchor="middle" font-size="20" fill="#f6f1e7">← h₂</text>
    <text x="490" y="334" text-anchor="middle" font-size="20" fill="#f6f1e7">← h₃</text>
    <text x="680" y="334" text-anchor="middle" font-size="20" fill="#f6f1e7">← h₄</text>

    <line x1="255" y1="327" x2="185" y2="327" stroke="#1c1814" stroke-width="4" marker-end="url(#arrow3)"/>
    <line x1="445" y1="327" x2="365" y2="327" stroke="#1c1814" stroke-width="4" marker-end="url(#arrow3)"/>
    <line x1="635" y1="327" x2="535" y2="327" stroke="#1c1814" stroke-width="4" marker-end="url(#arrow3)"/>

    <rect x="835" y="205" width="190" height="120" rx="18" fill="#ede6d6" stroke="#c85e35" stroke-width="3"/>
    <text x="930" y="240" text-anchor="middle" font-size="24" fill="#1c1814" font-weight="700">Token "like"</text>
    <text x="930" y="275" text-anchor="middle" font-size="19" fill="#6e6259">uses left context:</text>
    <text x="930" y="300" text-anchor="middle" font-size="19" fill="#6e6259">"I didn't"</text>
    <text x="930" y="330" text-anchor="middle" font-size="19" fill="#6e6259">and right context:</text>
    <text x="930" y="355" text-anchor="middle" font-size="19" fill="#6e6259">"it"</text>
  </g>
</svg>
