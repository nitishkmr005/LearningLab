<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460">
  <rect width="1100" height="460" fill="#f6f1e7"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="30" fill="#1c1814" font-weight="700">LSTM: cell state creates a memory highway</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="18" fill="#6e6259">The forget, input, and output gates decide what to keep, write, and expose while the cell state carries long-range memory forward.</text>

  <defs>
    <marker id="arrow4" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#c85e35"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <line x1="90" y1="165" x2="1010" y2="165" stroke="#c85e35" stroke-width="8" marker-end="url(#arrow4)"/>
    <text x="140" y="145" font-size="22" fill="#1c1814">C_(t-1)</text>
    <text x="930" y="145" font-size="22" fill="#1c1814">C_t</text>
    <text x="470" y="135" font-size="18" fill="#6e6259">cell state highway</text>

    <rect x="300" y="185" width="500" height="180" rx="24" fill="#ede6d6" stroke="#c85e35" stroke-width="3"/>
    <text x="550" y="220" text-anchor="middle" font-size="26" fill="#1c1814" font-weight="700">LSTM Cell</text>

    <circle cx="390" cy="275" r="42" fill="#f6f1e7" stroke="#c85e35" stroke-width="3"/>
    <text x="390" y="268" text-anchor="middle" font-size="20" fill="#1c1814" font-weight="700">Forget</text>
    <text x="390" y="292" text-anchor="middle" font-size="18" fill="#6e6259">gate f_t</text>

    <circle cx="550" cy="275" r="42" fill="#f6f1e7" stroke="#c85e35" stroke-width="3"/>
    <text x="550" y="268" text-anchor="middle" font-size="20" fill="#1c1814" font-weight="700">Input</text>
    <text x="550" y="292" text-anchor="middle" font-size="18" fill="#6e6259">gate i_t</text>

    <circle cx="710" cy="275" r="42" fill="#f6f1e7" stroke="#c85e35" stroke-width="3"/>
    <text x="710" y="268" text-anchor="middle" font-size="20" fill="#1c1814" font-weight="700">Output</text>
    <text x="710" y="292" text-anchor="middle" font-size="18" fill="#6e6259">gate o_t</text>

    <line x1="390" y1="185" x2="390" y2="233" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow4)"/>
    <line x1="550" y1="185" x2="550" y2="233" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow4)"/>
    <line x1="710" y1="185" x2="710" y2="233" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow4)"/>

    <text x="210" y="400" font-size="22" fill="#1c1814">x_t and h_(t-1)</text>
    <line x1="280" y1="390" x2="360" y2="325" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow4)"/>
    <line x1="280" y1="390" x2="520" y2="325" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow4)"/>
    <line x1="280" y1="390" x2="680" y2="325" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow4)"/>

    <line x1="710" y1="317" x2="710" y2="390" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow4)"/>
    <text x="710" y="425" text-anchor="middle" font-size="22" fill="#1c1814">h_t</text>

    <text x="860" y="255" font-size="18" fill="#6e6259">1. Forget old memory</text>
    <text x="860" y="285" font-size="18" fill="#6e6259">2. Write useful new info</text>
    <text x="860" y="315" font-size="18" fill="#6e6259">3. Expose what matters now</text>
  </g>
</svg>
