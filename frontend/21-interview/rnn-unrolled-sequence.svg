<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <rect width="1100" height="420" fill="#f6f1e7"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="30" fill="#1c1814" font-weight="700">Unrolled RNN: one hidden state passed through time</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="18" fill="#6e6259">Each step reads the current token x_t and the previous hidden state h_(t-1), then produces a new hidden state h_t.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#c85e35"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <rect x="80" y="170" width="150" height="90" rx="18" fill="#ede6d6" stroke="#c85e35" stroke-width="3"/>
    <text x="155" y="205" text-anchor="middle" font-size="22" fill="#1c1814" font-weight="700">RNN Cell</text>
    <text x="155" y="235" text-anchor="middle" font-size="20" fill="#6e6259">step 1</text>
    <text x="155" y="330" text-anchor="middle" font-size="22" fill="#1c1814">x₁ = "the"</text>
    <text x="155" y="145" text-anchor="middle" font-size="22" fill="#1c1814">h₁</text>

    <rect x="330" y="170" width="150" height="90" rx="18" fill="#ede6d6" stroke="#c85e35" stroke-width="3"/>
    <text x="405" y="205" text-anchor="middle" font-size="22" fill="#1c1814" font-weight="700">RNN Cell</text>
    <text x="405" y="235" text-anchor="middle" font-size="20" fill="#6e6259">step 2</text>
    <text x="405" y="330" text-anchor="middle" font-size="22" fill="#1c1814">x₂ = "food"</text>
    <text x="405" y="145" text-anchor="middle" font-size="22" fill="#1c1814">h₂</text>

    <rect x="580" y="170" width="150" height="90" rx="18" fill="#ede6d6" stroke="#c85e35" stroke-width="3"/>
    <text x="655" y="205" text-anchor="middle" font-size="22" fill="#1c1814" font-weight="700">RNN Cell</text>
    <text x="655" y="235" text-anchor="middle" font-size="20" fill="#6e6259">step 3</text>
    <text x="655" y="330" text-anchor="middle" font-size="22" fill="#1c1814">x₃ = "was"</text>
    <text x="655" y="145" text-anchor="middle" font-size="22" fill="#1c1814">h₃</text>

    <rect x="830" y="170" width="170" height="90" rx="18" fill="#ede6d6" stroke="#c85e35" stroke-width="3"/>
    <text x="915" y="205" text-anchor="middle" font-size="22" fill="#1c1814" font-weight="700">RNN Cell</text>
    <text x="915" y="235" text-anchor="middle" font-size="20" fill="#6e6259">final step</text>
    <text x="915" y="330" text-anchor="middle" font-size="22" fill="#1c1814">x₉ = "slow"</text>
    <text x="915" y="145" text-anchor="middle" font-size="22" fill="#1c1814">h₉</text>

    <line x1="230" y1="215" x2="330" y2="215" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="480" y1="215" x2="580" y2="215" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="730" y1="215" x2="830" y2="215" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow)"/>

    <line x1="155" y1="295" x2="155" y2="260" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="405" y1="295" x2="405" y2="260" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="655" y1="295" x2="655" y2="260" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="915" y1="295" x2="915" y2="260" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow)"/>

    <line x1="155" y1="170" x2="155" y2="120" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="405" y1="170" x2="405" y2="120" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="655" y1="170" x2="655" y2="120" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="915" y1="170" x2="915" y2="120" stroke="#c85e35" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="280" y="197" font-size="18" fill="#6e6259">same weights</text>
    <text x="530" y="197" font-size="18" fill="#6e6259">same weights</text>
    <text x="780" y="197" font-size="18" fill="#6e6259">same weights</text>

    <rect x="835" y="70" width="160" height="36" rx="10" fill="#1c1814"/>
    <text x="915" y="94" text-anchor="middle" font-size="18" fill="#f6f1e7">sentence summary</text>
  </g>
</svg>
